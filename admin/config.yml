backend:
  name: github
  repo: ghanemfurnture-del/ghanem-furniture-site
  branch: main
  base_url: https://ghanem-oauth-gateway.vercel.app
  auth_endpoint: auth

# اسم الموقع كما سيظهر في اللوحة
site_url: https://ghanem-furniture.vercel.app
display_url: https://ghanem-furniture.vercel.app
logo_url: /images/logo.svg

media_folder: "images/gallery"
public_folder: "/images/gallery"

locale: "ar"

collections:
  - name: "gallery"
    label: "معرض الأعمال"
    files:
      - name: "kitchens"
        label: "المطابخ المودرن"
        file: "data/gallery/kitchens.json"
        fields: &gallery_item_fields
          - label: "قائمة الصور والمنتجات"
            name: "items"
            widget: "list"
            label_singular: "منتج / صورة"
            summary: "{{title}}"
            fields:
              - { label: "العنوان", name: "title", widget: "string" }
              - { label: "الوصف", name: "description", widget: "text", required: false }
              - { label: "التصنيف الظاهر على الصورة (مثال: مطبخ مودرن)", name: "badge", widget: "string", required: false }
              - label: "الأقسام (تحدد فين هتظهر الصورة في الفلاتر)"
                name: "category"
                widget: "select"
                multiple: true
                options: &gallery_category_options
                  - { label: "المطابخ المودرن", value: "kitchens" }
                  - { label: "غرف النوم والدريسنج", value: "bedrooms" }
                  - { label: "الأعمال الخشبية والديكورات", value: "woodwork" }
                  - { label: "أسقف خشبية وديكورات", value: "ceilings" }
                  - { label: "وحدات تلفزيون وديكورات", value: "tv-units" }
                  - { label: "موبليا وأثاث مخصص", value: "furniture" }
                  - { label: "إضاءات خشبية مزخرفة", value: "lighting" }
                  - { label: "سلالم خشبية", value: "staircases" }
                  - { label: "التصميمات المنفذة", value: "designs" }
                  - { label: "تصاميم 3D", value: "designs-3d" }
                  - { label: "خدمات الورش (B2B)", value: "workshop" }
              - { label: "الصورة", name: "image", widget: "image" }
              - { label: "نص بديل للصورة (اختياري - لتحسين محركات البحث)", name: "alt", widget: "string", required: false }

      - name: "bedrooms"
        label: "غرف النوم والدريسنج"
        file: "data/gallery/bedrooms.json"
        fields: *gallery_item_fields

      - name: "woodwork"
        label: "الأعمال الخشبية والديكورات (يشمل الأسقف ووحدات التلفزيون والإضاءات والسلالم)"
        file: "data/gallery/woodwork.json"
        fields: *gallery_item_fields

      - name: "furniture"
        label: "موبليا وأثاث مخصص"
        file: "data/gallery/furniture.json"
        fields: *gallery_item_fields

      - name: "designs"
        label: "التصميمات المنفذة"
        file: "data/gallery/designs.json"
        fields: *gallery_item_fields

      - name: "designs-3d"
        label: "تصاميم 3D"
        file: "data/gallery/designs-3d.json"
        fields: *gallery_item_fields

      - name: "workshop"
        label: "خدمات الورش (B2B)"
        file: "data/gallery/workshop.json"
        fields: *gallery_item_fields

  - name: "testimonials"
    label: "آراء وتقييمات العملاء"
    files:
      - name: "published_reviews"
        label: "آراء العملاء المنشورة"
        file: "data/reviews-published.json"
        description: "الآراء المعتمدة المعروضة حالياً على الموقع"
        fields:
          - label: "قائمة التقييمات المنشورة"
            name: "reviews"
            widget: "list"
            label_singular: "رأي منشور"
            summary: "{{name}} - {{rating}} نجوم"
            fields:
              - { label: "المعرّف (ID)", name: "id", widget: "string", required: false }
              - { label: "اسم العميل", name: "name", widget: "string" }
              - { label: "التقييم (من 1 إلى 5 نجوم)", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, default: 5 }
              - { label: "تاريخ التقييم (مثال: 5 مايو 2025)", name: "date", widget: "string" }
              - { label: "نص الرأي / التعليق", name: "quote", widget: "text" }

      - name: "pending_reviews"
        label: "آراء تحت المراجعة (Pending)"
        file: "data/reviews-pending.json"
        description: "الآراء الواردة حديثاً من زوار الموقع عبر النموذج والتي تنتظر الاعتماد"
        fields:
          - label: "قائمة التقييمات الواردة"
            name: "reviews"
            widget: "list"
            label_singular: "رأي معلّق"
            summary: "{{name}} ({{rating}} نجوم) - {{date}}"
            fields:
              - { label: "المعرّف (ID)", name: "id", widget: "string", required: false }
              - { label: "اسم العميل", name: "name", widget: "string" }
              - { label: "التقييم (من 1 إلى 5 نجوم)", name: "rating", widget: "number", value_type: "int", min: 1, max: 5 }
              - { label: "تاريخ التقييم", name: "date", widget: "string" }
              - { label: "نص الرأي / التعليق", name: "quote", widget: "text" }
              - { label: "تاريخ ووقت الإرسال الفعلي", name: "submitted_at", widget: "string", required: false }
