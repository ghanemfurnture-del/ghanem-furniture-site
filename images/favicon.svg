<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF3CD" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#886326" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141720" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.45" />
    </filter>
  </defs>
  
  <!-- Rounded Background Tile -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Luxury Stylized G Monogram for Ghanem Furniture -->
  <g filter="url(#goldGlow)">
    <path d="M 68 34 
             C 62 26, 44 24, 33 34 
             C 22 44, 22 60, 33 70 
             C 44 80, 62 78, 68 68 
             C 71 63, 72 58, 72 52 
             L 48 52 
             L 48 44 
             L 80 44 
             C 80 62, 75 74, 62 84 
             C 44 96, 20 88, 12 70 
             C 4 52, 10 32, 28 18 
             C 48 4, 72 10, 84 24 
             Z" 
          fill="url(#goldGrad)" />
  </g>
  
  <!-- Subtle Craftsmanship Accent Dot -->
  <circle cx="50" cy="18" r="2.5" fill="#FDF3CD" />
</svg>
